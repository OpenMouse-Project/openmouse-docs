"area: ui":
  - changed-files:
      - any-glob-to-any-file: ["src/**"]
"area: site":
  - changed-files:
      - any-glob-to-any-file: ["docusaurus.config.*", "sidebars.*"]
"area: artwork":
  - changed-files:
      - any-glob-to-any-file: ["static/**"]
"area: documentation":
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "**/*.mdx", "docs/**"]
"area: dependencies":
  - changed-files:
      - any-glob-to-any-file: ["**/package.json", "**/package-lock.json", "**/Cargo.toml", "**/Cargo.lock"]
"area: ci":
  - changed-files:
      - any-glob-to-any-file: [".github/**", "build/**", "scripts/**", "**/build.rs", "vite.config.*", "tsconfig*.json"]
